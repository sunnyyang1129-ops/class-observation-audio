<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專家教師錄影教學觀察紀錄表</title>
<style>
  :root{
    --ink:#22303f;
    --ink-soft:#5c6c7a;
    --paper:#f6f5f1;
    --panel:#ffffff;
    --line:#dcdbd4;
    --accent:#3e6259;
    --accent-soft:#e7efec;
    --record:#a8443a;
    --record-soft:#f6e6e3;
    --ok:#3e6259;
    --warn:#b8863b;
    --warn-soft:#f7ecd9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    padding-bottom:80px;
  }
  header{
    background:var(--ink);
    color:#fff;
    padding:20px 18px 24px;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.2rem;
    font-weight:700;
    letter-spacing:.02em;
  }
  header p{
    margin:0;
    font-size:.85rem;
    color:#c7d0d6;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  .gate{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-top:-14px;
    box-shadow:0 6px 18px rgba(34,48,63,.08);
  }
  .gate label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink-soft);
  }
  .gate input{
    width:100%;
    padding:12px 14px;
    font-size:1rem;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fbfbf9;
  }
  .gate button{
    margin-top:12px;
    width:100%;
    padding:13px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
  }
  .gate .hint{font-size:.78rem;color:var(--ink-soft);margin-top:8px;}

  #app{display:none;}

  .progress-bar{
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    padding:10px 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .progress-bar .track{
    height:6px;background:var(--line);border-radius:3px;overflow:hidden;
  }
  .progress-bar .fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}
  .progress-bar .label{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}

  .resume-banner{
    margin:14px 0;padding:14px;background:var(--warn-soft);border:1px solid var(--warn);
    border-radius:10px;font-size:.85rem;color:#6b4f1f;display:none;
  }

  .section-title{
    margin:26px 0 10px;
    font-size:1rem;
    font-weight:700;
    color:var(--accent);
    padding-bottom:6px;
    border-bottom:2px solid var(--accent-soft);
  }

  .qcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
    position:relative;
  }
  .qcard.done{border-color:var(--ok);}
  .qtext{
    font-size:.98rem;
    font-weight:600;
    margin:4px 0 12px;
    color:var(--ink);
  }
  .status-chip{
    position:absolute;top:14px;right:14px;
    font-size:.7rem;
    padding:2px 8px;
    border-radius:20px;
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:700;
    display:none;
  }
  .status-chip.show{display:inline-block;}

  textarea, input[type=text], input[type=date]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:.92rem;
    font-family:inherit;
    background:#fbfbf9;
    color:var(--ink);
  }
  textarea{min-height:80px;resize:vertical;}

  input[readonly], input:disabled{
    background:var(--accent-soft) !important;
    color:var(--ink) !important;
    cursor:default;
  }

  .checkbox-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .checkbox-list label{
    display:flex;align-items:flex-start;gap:8px;
    font-size:.92rem;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fbfbf9;
    cursor:pointer;
  }
  .checkbox-list label.disabled{opacity:.45;cursor:not-allowed;}
  .checkbox-list input[type=checkbox], .checkbox-list input[type=radio]{margin-top:3px;width:18px;height:18px;flex-shrink:0;}
  .other-input{display:none;margin-top:6px;}
  .other-input.show{display:block;}
  .ampm-row{display:flex;gap:10px;margin-bottom:8px;}
  .ampm-row label{flex:1;}

  .controls{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .rec-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--record);
    background:var(--record-soft);
    color:var(--record);
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
  }
  .rec-btn.active{
    background:var(--record);
    color:#fff;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;background:var(--record);
    display:inline-block;
  }
  .rec-btn.active .dot{background:#fff;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .send-btn{
    padding:9px 16px;
    border-radius:20px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
  }
  .send-btn:disabled{opacity:.5;cursor:default;}

  .batch-submit-wrap{
    text-align:center;
    margin:6px 0 30px;
  }
  .batch-submit-wrap .send-btn{
    padding:12px 28px;
    font-size:.95rem;
  }

  audio{
    display:block;
    width:100%;
    margin-top:10px;
    height:34px;
  }
  .rec-time{font-size:.8rem;color:var(--record);font-weight:700;min-width:44px;}

  footer.note{
    max-width:640px;margin:20px auto 40px;padding:0 16px;
    font-size:.75rem;color:var(--ink-soft);
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(34,48,63,.55);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:14px;padding:22px;max-width:340px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .modal-box p{margin:0 0 18px;font-size:.92rem;color:var(--ink);line-height:1.6;}
  .modal-box button{
    display:block;width:100%;margin-bottom:10px;padding:11px;border-radius:8px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;
    font-weight:700;font-size:.88rem;cursor:pointer;
  }
  .modal-box button.secondary{background:#fff;color:var(--accent);}
  .modal-box button:last-child{margin-bottom:0;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>專家教師錄影教學觀察紀錄表</h1>
    <p>詳答題可直接說話錄音，系統會將錄音檔上傳至雲端；也可以直接打字回答（兩者僅能擇一上傳）。</p>
  </div>
</header>

<div class="wrap">
  <div class="gate" id="gate">
    <label for="codeInput">請輸入您的姓名</label>
    <input type="text" id="codeInput" placeholder="請輸入本名">
    <button onclick="startSession()">開始填答</button>
    <div class="hint">若先前已用同一裝置、同一姓名填過，會自動載入先前的進度。</div>
  </div>
</div>

<div id="app">
  <div class="progress-bar">
    <div class="wrap" style="padding:0;">
      <div class="track"><div class="fill" id="progressFill"></div></div>
      <div class="label" id="progressLabel">已完成 0 / 0 題</div>
    </div>
  </div>

  <div class="wrap">
    <div class="resume-banner" id="resumeBanner"></div>
  </div>

  <div class="wrap" id="questionArea"></div>

  <div class="wrap">
    <div id="reviewPanel" style="display:none;margin:20px 0;"></div>
  </div>

  <div class="wrap">
    <div id="doneBanner" style="display:none;margin:20px 0;padding:16px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;text-align:center;font-weight:700;color:var(--accent);">
    </div>
  </div>

  <footer class="note">
    每一項送出後即會上傳保存。若中途離開頁面，重新用同一裝置、同一填答代碼打開此網址，先前已送出的題目會標示「已送出」，未完成的題目也會提醒您繼續填答（此記錄僅存在目前這個瀏覽器內，換裝置或清除瀏覽器資料會失效）。
  </footer>
</div>

<button id="backToReviewBtn" onclick="scrollToReview()" style="display:none;position:fixed;right:16px;bottom:16px;z-index:999;padding:12px 18px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;">
  回到確認畫面
</button>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9rjiabdFWGZsJKc2yBUW3M3nKfC8pmk79JZ_eU38h5Z6eWky2LussDpUFx_9zTL4w/exec";
const STORAGE_KEY = "obsSurveyProgress_v1";

// ---------- 讀取網址參數（?name=王小明）----------
const urlParams = new URLSearchParams(window.location.search);
const urlName = (urlParams.get('name') || '').trim();

if(urlName){
  const codeInputEl = document.getElementById('codeInput');
  const gateLabelEl = document.querySelector('.gate label');
  const gateHintEl = document.querySelector('.gate .hint');
  const gateBtnEl = document.querySelector('.gate button');
  if(codeInputEl){
    codeInputEl.value = urlName;
    codeInputEl.readOnly = true;
  }
  if(gateLabelEl){
    gateLabelEl.textContent = '請核對您的姓名是否正確';
  }
  if(gateHintEl){
    gateHintEl.textContent = '姓名已由系統帶入，不需自行輸入，確認無誤後請按下方按鈕開始填答。';
  }
  if(gateBtnEl){
    gateBtnEl.textContent = '核對無誤，開始填答';
  }
} else {
  const gateHintEl = document.querySelector('.gate .hint');
  if(gateHintEl){
    gateHintEl.textContent = '請洽承辦人員取得您的專屬連結，姓名將由系統自動帶入，不需自行輸入。若您是直接看到這則訊息，代表目前開啟的網址缺少姓名資訊，請確認連結是否正確。';
  }
}

// ---------- 一、觀課基本資訊 ----------
// 授課教師清單會於進入填答畫面時，向後端即時查詢「授課教師代號清單」分頁取得
let TEACHER_OPTIONS = [];
const BASIC_INFO = [
  {section:"一、觀課基本資訊", id:"term", text:"本次觀課紀錄屬於：", type:"singlechoice", options:["第一次","第二次"]},
  {section:"一、觀課基本資訊", id:"teacher", text:"本次觀察的授課教師（每次僅填寫一位）", type:"singlechoice", options: TEACHER_OPTIONS}
];

// ---------- 二、課前準備（錄音，逐題送出） ----------
const PRE_CLASS = [
  {section:"二、課前準備", id:"1", text:"授課住院醫師說明該教學活動的目標、使用的教材、教學方法等", type:"record"},
  {section:"二、課前準備", id:"2", text:"觀課前共識內容", type:"record"}
];

// ---------- 三、全課堂觀察（一）教學觀察：量表（可複選） ----------
const SCALE = [
  {section:"三、全課堂觀察（一）教學觀察", id:"1-2", text:"講解清晰度／課程結構", type:"scale",
    options:["跳過此項","清楚闡述教學目標","條理分明/教學單元化","連結先備知識","摘要總結","教學步調適宜","其他"]},
  {section:"三、全課堂觀察（一）教學觀察", id:"3-4", text:"教學內容/教學關聯性", type:"scale",
    options:["跳過此項","展現學科專業性","與研究連結","難易度適中","提供最新發展資訊","緊扣課程目標","其他"]},
  {section:"三、全課堂觀察（一）教學觀察", id:"5", text:"有效溝通", type:"scale",
    options:["跳過此項","激發學員學習熱忱","善用實例講解","清楚解釋複雜概念","即時確認學員的理解狀況","定義名詞、概念或原則","其他"]},
  {section:"三、全課堂觀察（一）教學觀察", id:"6", text:"師生互動", type:"scale",
    options:["跳過此項","鼓勵發問及發言","鼓勵主動學習和課堂參與","維持學員專注力","其他"]},
  {section:"三、全課堂觀察（一）教學觀察", id:"7", text:"支持學員學習", type:"scale",
    options:["跳過此項","培養批判思考能力","鼓勵學員自主學習","鼓勵獨立分析、詮釋能力","透過評量或提問了解學習進展","提供有效的回饋","其他"]},
  {section:"三、全課堂觀察（一）教學觀察", id:"8-9", text:"教材運用／教學氛圍", type:"scale",
    options:["跳過此項","教學場域適合課程設計","教學講義項目：投影講義/書面/影音/其他","講授內容視覺化幫助理解","採翻轉教學或遠距教學","其他"]}
];

// ---------- 學員學習觀察 觀察表一（錄音，逐題送出） ----------
const OBS1 = [
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"1", text:"學員到課及遲到（或早退）情形如何？", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"2", text:"學員投入課堂學習的程度如何？（如參與討論度、提問頻率、與同儕互動情形等）", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"3", text:"小組內互動情形如何？（討論的頻率、互動內容以及互動方式等）", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"4", text:"內容是否聚焦課程主題？", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"5", text:"學員對哪個部分感到興趣？", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"6", text:"學員對哪個部分較無法理解？", type:"record"},
  {section:"觀察表一：學員課程表現及對於課程的專注度等觀察紀錄", id:"7", text:"其他觀察", type:"record"}
];

// ---------- 觀察表二（錄音，逐題送出） ----------
const OBS2 = [
  {section:"觀察表二：特別教學行為與學習行為的觀察（如遊戲化教學、科技輔助教學等）", id:"1", text:"教學主題", type:"record"},
  {section:"觀察表二：特別教學行為與學習行為的觀察（如遊戲化教學、科技輔助教學等）", id:"2", text:"教師教學行為", type:"record"},
  {section:"觀察表二：特別教學行為與學習行為的觀察（如遊戲化教學、科技輔助教學等）", id:"3", text:"學員的反應", type:"record"},
  {section:"觀察表二：特別教學行為與學習行為的觀察（如遊戲化教學、科技輔助教學等）", id:"4", text:"學員的學習行為", type:"record"},
  {section:"觀察表二：特別教學行為與學習行為的觀察（如遊戲化教學、科技輔助教學等）", id:"5", text:"您的觀察紀錄", type:"record"}
];

// ---------- 觀察後回饋（錄音，逐題送出） ----------
const FEEDBACK = [
  {section:"觀察後回饋", id:"1", text:"欣賞課程哪些優點？", type:"record"},
  {section:"觀察後回饋", id:"2", text:"有哪方面可以改善與其建議？", type:"record"},
  {section:"觀察後回饋", id:"3", text:"分享觀課的心得或收穫？", type:"record"},
  {section:"觀察後回饋", id:"4", text:"問題提問", type:"record"}
];

const ITEMS = [].concat(BASIC_INFO, PRE_CLASS, SCALE, OBS1, OBS2, FEEDBACK);
const BASIC_START = 0;
const BASIC_END = BASIC_INFO.length - 1;
const SCALE_START = BASIC_INFO.length + PRE_CLASS.length;
const SCALE_END = SCALE_START + SCALE.length - 1;

let respondentCode = "";
let baseName = "";
let completedCount = 0;
let sessionStarted = false;
let savedProgress = {};
let finalized = false;

function loadAllProgress(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  }catch(e){
    return {};
  }
}
function saveAllProgress(all){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }catch(e){}
}
function markItemDone(idx, value){
  const all = loadAllProgress();
  if(!all[respondentCode]) all[respondentCode] = {};
  all[respondentCode][idx] = {done:true, value: value || ""};
  saveAllProgress(all);
  savedProgress = all[respondentCode];
}

async function startSession(){
  const val = document.getElementById('codeInput').value.trim();
  if(!val){
    alert("請先輸入姓名");
    return;
  }
  baseName = val;
  respondentCode = val;
  sessionStarted = true;
  finalized = false;
  completedCount = 0;

  const startBtn = document.querySelector('.gate button');
  startBtn.disabled = true;
  startBtn.textContent = "載入中...";

  await loadTeacherOptions();

  startBtn.disabled = false;
  startBtn.textContent = urlName ? '核對無誤，開始填答' : '開始填答';

  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('questionArea').style.display = '';
  document.querySelector('.progress-bar').style.display = '';
  document.getElementById('reviewPanel').style.display = 'none';
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('resumeBanner').style.display = 'none';
  document.getElementById('backToReviewBtn').style.display = 'none';

  renderItems();

  // ---------- 偵測是否有上次尚未完成的觀課紀錄，詢問是否繼續 ----------
  const allProgress = loadAllProgress();
  const lastActiveCode = allProgress.__lastActive && allProgress.__lastActive[baseName];
  const lastRec = lastActiveCode ? allProgress[lastActiveCode] : null;

  if(lastActiveCode && lastRec && !lastRec.__complete){
    const parts = lastActiveCode.split('｜');
    const term = parts[1] || '';
    const teacher = parts[2] || '';
    const resumeChoice = await showChoiceModal(
      `偵測到您上次有一筆尚未填完的觀課紀錄（${term}．${teacher}），要繼續完成這一筆嗎？`,
      [
        {label:'繼續完成這筆未完成的紀錄', value:'resume'},
        {label:'不要，重新選擇', value:'fresh'}
      ]
    );
    if(resumeChoice === 'resume'){
      selectRadioValue(0, term);
      selectRadioValue(1, teacher);
      activateIdentity(lastActiveCode);
      return;
    } else {
      delete allProgress.__lastActive[baseName];
      saveAllProgress(allProgress);
    }
  }

  updateProgress();
}

// ---------- 手動勾選指定的單選題選項（用於還原上次尚未完成的紀錄）----------
function selectRadioValue(idx, value){
  document.querySelectorAll(`input[name="single-${idx}"]`).forEach(r => {
    if(r.value === value) r.checked = true;
  });
}

// ---------- 記錄目前這位教授「進行中、尚未完成」的紀錄，供意外重新整理後可續填 ----------
function markLastActive(code){
  const all = loadAllProgress();
  if(!all.__lastActive) all.__lastActive = {};
  all.__lastActive[baseName] = code;
  saveAllProgress(all);
}

// ---------- 正式切換為某個 respondentCode 身分，鎖定第一部分、還原已完成的內容 ----------
function activateIdentity(candidateCode){
  respondentCode = candidateCode;
  savedProgress = loadAllProgress()[candidateCode] || {};

  document.querySelectorAll('input[name="single-0"]').forEach(r => r.disabled = true);
  document.querySelectorAll('input[name="single-1"]').forEach(r => r.disabled = true);
  const btn = document.getElementById('batchbtn-basic');
  if(btn) btn.style.display = 'none';

  const card0 = document.getElementById('qcard-0');
  const card1 = document.getElementById('qcard-1');
  if(card0 && !card0.classList.contains('done')){ card0.classList.add('done'); completedCount++; }
  if(card1 && !card1.classList.contains('done')){ card1.classList.add('done'); completedCount++; }
  const chip0 = document.getElementById('chip-0');
  const chip1 = document.getElementById('chip-1');
  if(chip0) chip0.classList.add('show');
  if(chip1) chip1.classList.add('show');

  restoreProgress();
  updateProgress();
}

function escapeHtml(str){
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---------- 送出「一、觀課基本資訊」，並檢查是否與先前已完成的紀錄重複 ----------
async function submitBasicInfoAndProceed(){
  const term = getSingleChoiceValue(0);
  const teacher = getSingleChoiceValue(1);

  if(!term){ alert('請選擇本次觀課紀錄屬於第一次或第二次'); return; }
  if(!teacher){ alert('請選擇本次觀察的授課教師'); return; }

  const candidateCode = baseName + '｜' + term + '｜' + teacher;
  const btn = document.getElementById('batchbtn-basic');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '確認中...';

  const allProgress = loadAllProgress();
  const localRec = allProgress[candidateCode];
  const localComplete = !!(localRec && localRec.__complete);
  const localHasProgress = !!(localRec && Object.keys(localRec).some(k => k !== '__complete'));
  const looksLikeResume = localHasProgress && !localComplete;

  let existsOnServer = false;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=checkExisting&respondentCode=' + encodeURIComponent(candidateCode));
    const json = await res.json();
    existsOnServer = !!(json.status === 'ok' && json.exists);
  }catch(err){
    existsOnServer = false;
  }

  if((existsOnServer || localComplete) && !looksLikeResume){
    const choice = await showChoiceModal(
      `系統偵測到「${teacher}」在本次（${term}）已經有填寫完成的紀錄。若繼續，將會覆蓋原本已送出的資料，請確認是否要覆蓋？`,
      [
        {label:'確定覆蓋，重新填寫這位教師的紀錄', value:'overwrite'},
        {label:'取消，重新選擇教師', value:'cancel'}
      ]
    );
    if(choice !== 'overwrite'){
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }
    try{
      const fd = new FormData();
      fd.append('action', 'clearRespondent');
      fd.append('respondentCode', candidateCode);
      await fetch(APPS_SCRIPT_URL, { method:'POST', mode:'no-cors', body: fd });
    }catch(err){}
    delete allProgress[candidateCode];
    saveAllProgress(allProgress);
  }

  // 正式切換為本回合的填答身分，並記錄為「進行中」以便意外重新整理後可續填
  markLastActive(candidateCode);
  activateIdentity(candidateCode);
}

function renderItems(){
  const area = document.getElementById('questionArea');
  let lastSection = null;
  let html = "";

  ITEMS.forEach((item, idx) => {
    if(item.section !== lastSection){
      html += `<div class="section-title">${item.section}</div>`;
      lastSection = item.section;
    }

    html += `<div class="qcard" id="qcard-${idx}"><div class="status-chip" id="chip-${idx}">已送出</div>`;
    html += `<div class="qtext">${item.text}</div>`;

    if(item.type === 'text'){
      html += `<input type="text" id="field-${idx}">`;
    }

    if(item.type === 'date'){
      html += `<input type="date" id="field-${idx}">`;
    }

    if(item.type === 'ampmtime'){
      html += `<div class="ampm-row">
        <label><input type="radio" name="ampm-${idx}" id="ampm-${idx}-am" value="上午"> 上午</label>
        <label><input type="radio" name="ampm-${idx}" id="ampm-${idx}-pm" value="下午"> 下午</label>
      </div>`;
      html += `<input type="text" id="field-${idx}" placeholder="請輸入時段，例如：10:00-12:00">`;
    }

    if(item.type === 'singlechoice'){
      html += `<div class="checkbox-list">`;
      item.options.forEach((opt) => {
        html += `<label><input type="radio" name="single-${idx}" value="${opt}"> ${opt}</label>`;
      });
      html += `</div>`;
    }

    if(item.type === 'multiselect'){
      html += `<div class="checkbox-list">`;
      item.options.forEach((opt) => {
        html += `<label><input type="checkbox" data-multiselect="${idx}" value="${opt}"> ${opt}</label>`;
      });
      html += `</div>`;
    }

    if(item.type === 'scale'){
      html += `<div class="checkbox-list">`;
      item.options.forEach((opt) => {
        if(opt === '跳過此項'){
          html += `<label><input type="checkbox" data-scale="${idx}" data-skip="true" value="跳過此項" onchange="handleScaleCheck(${idx})"> 跳過此項</label>`;
        } else if(opt === '其他'){
          html += `<label><input type="checkbox" data-scale="${idx}" value="其他" onchange="handleScaleCheck(${idx})"> 其他</label>`;
        } else {
          html += `<label><input type="checkbox" data-scale="${idx}" value="${opt}" onchange="handleScaleCheck(${idx})"> ${opt}</label>`;
        }
      });
      html += `</div>`;
      html += `<input type="text" id="other-${idx}" class="other-input" placeholder="請說明「其他」內容">`;
    }

    if(item.type === 'record'){
      html += `<textarea id="text-${idx}" placeholder="可直接打字，或按下方按鈕開始錄音自動產生文字草稿"></textarea>`;
      html += `<div class="controls">
        <button class="rec-btn" id="recbtn-${idx}" onclick="toggleRecord(${idx})">
          <span class="dot"></span><span id="recbtn-label-${idx}">開始錄音</span>
        </button>
        <span class="rec-time" id="rectime-${idx}"></span>
        <button class="send-btn" id="sendbtn-${idx}" onclick="sendAnswer(${idx})">送出這一題</button>
      </div>
      <audio id="audio-${idx}" controls style="display:none;"></audio>`;
    }

    html += `</div>`;

    if(idx === BASIC_END){
      html += `<div class="batch-submit-wrap">
        <button class="send-btn" id="batchbtn-basic" onclick="submitBasicInfoAndProceed()">送出觀課基本資訊</button>
      </div>`;
    }
    if(idx === SCALE_END){
      html += `<div class="batch-submit-wrap">
        <button class="send-btn" id="batchbtn-scale" onclick="sendBatch(${SCALE_START}, ${SCALE_END}, 'batchbtn-scale')">送出量表勾選結果</button>
      </div>`;
    }
  });

  area.innerHTML = html;
}

function restoreProgress(){
  const entries = Object.keys(savedProgress).filter(k => k !== '__complete');
  if(entries.length === 0) return;

  entries.forEach(idxStr => {
    const idx = parseInt(idxStr, 10);
    const item = ITEMS[idx];
    if(!item) return;
    const rec = savedProgress[idxStr];
    if(!rec || !rec.done) return;

    if(item.type === 'text' || item.type === 'date'){
      const f = document.getElementById('field-'+idx);
      if(f) f.value = rec.value;
    } else if(item.type === 'ampmtime'){
      const val = rec.value || '';
      const spaceIdx = val.indexOf(' ');
      const ampm = spaceIdx > -1 ? val.slice(0, spaceIdx) : '';
      const timeText = spaceIdx > -1 ? val.slice(spaceIdx+1) : val;
      if(ampm === '上午' || ampm === '下午'){
        const radio = document.getElementById('ampm-'+idx+'-'+(ampm === '上午' ? 'am' : 'pm'));
        if(radio) radio.checked = true;
        const f = document.getElementById('field-'+idx);
        if(f) f.value = timeText;
      } else {
        const f = document.getElementById('field-'+idx);
        if(f) f.value = val;
      }
    } else if(item.type === 'singlechoice'){
      const val = rec.value || '';
      const radio = document.querySelector(`input[name="single-${idx}"][value="${val}"]`);
      if(radio) radio.checked = true;
    } else if(item.type === 'multiselect'){
      const parts = (rec.value || '').split('、');
      parts.forEach(p => {
        const box = document.querySelector(`input[data-multiselect="${idx}"][value="${p}"]`);
        if(box) box.checked = true;
      });
    } else if(item.type === 'scale'){
      // 還原勾選狀態
      const parts = (rec.value || '').split('、');
      parts.forEach(p => {
        if(p.startsWith('其他：')){
          const box = document.querySelector(`input[data-scale="${idx}"][value="其他"]`);
          if(box){ box.checked = true; }
          const otherVal = p.replace('其他：','');
          const otherField = document.getElementById('other-'+idx);
          if(otherField && otherVal !== '（未填寫說明）') otherField.value = otherVal;
        } else {
          const box = document.querySelector(`input[data-scale="${idx}"][value="${p}"]`);
          if(box) box.checked = true;
        }
      });
      refreshScaleState(idx);
    } else if(item.type === 'record'){
      const t = document.getElementById('text-'+idx);
      if(t) t.value = rec.value;
    }

    const card = document.getElementById('qcard-'+idx);
    if(card) card.classList.add('done');
    const chip = document.getElementById('chip-'+idx);
    if(chip) chip.classList.add('show');
    completedCount++;
  });

  const doneCount = entries.length;
  const remain = ITEMS.length - doneCount;
  if(doneCount > 0){
    const banner = document.getElementById('resumeBanner');
    banner.style.display = 'block';
    banner.textContent = `偵測到您先前已完成 ${doneCount} 題，尚有 ${remain} 題未完成，請繼續往下填答。（已完成的題目仍可重新編輯後再次送出）`;
  }
}

function toggleOtherInput(idx){
  const checkbox = document.querySelector(`input[data-scale="${idx}"][value="其他"]`);
  const otherInput = document.getElementById('other-'+idx);
  if(!checkbox || !otherInput) return;
  if(checkbox.checked && !checkbox.disabled){
    otherInput.classList.add('show');
  } else {
    otherInput.classList.remove('show');
    otherInput.value = '';
  }
}

// 勾選「跳過此項」時，鎖定同一題其他選項；反之勾選其他任一選項時，鎖定「跳過此項」
function refreshScaleState(idx){
  const boxes = Array.from(document.querySelectorAll(`input[data-scale="${idx}"]`));
  const skipBox = boxes.find(b => b.dataset.skip === "true");
  if(!skipBox) return;
  const otherBoxes = boxes.filter(b => b !== skipBox);
  const anyOtherChecked = otherBoxes.some(b => b.checked);

  if(skipBox.checked){
    otherBoxes.forEach(b => { b.checked = false; b.disabled = true; });
    skipBox.disabled = false;
  } else if(anyOtherChecked){
    otherBoxes.forEach(b => { b.disabled = false; });
    skipBox.disabled = true;
  } else {
    otherBoxes.forEach(b => { b.disabled = false; });
    skipBox.disabled = false;
  }

  boxes.forEach(b => {
    const label = b.closest('label');
    if(label) label.classList.toggle('disabled', b.disabled);
  });

  toggleOtherInput(idx);
}

function handleScaleCheck(idx){
  refreshScaleState(idx);
}

// ---- 選擇視窗（文字/錄音衝突時使用） ----
function showChoiceModal(message, choices){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const p = document.createElement('p');
    p.textContent = message;
    box.appendChild(p);
    choices.forEach((c, i) => {
      const btn = document.createElement('button');

      box.appendChild(btn);
    });
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

// ---- recording state per question ----
const recState = {};

function getRecognitionClass(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

async function toggleRecord(idx){
  if(!recState[idx]) recState[idx] = {recording:false};
  const st = recState[idx];

  if(!st.recording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      st.stream = stream;
      st.chunks = [];

      const mimeCandidates = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
      let chosenMime = '';
      for(const m of mimeCandidates){
        if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){
          chosenMime = m; break;
        }
      }
      const extMap = {'audio/mp4':'m4a','audio/webm':'webm','audio/ogg':'ogg'};
      const baseMime = chosenMime.split(';')[0];
      st.mimeType = chosenMime || 'audio/webm';
      st.fileExt = extMap[baseMime] || 'webm';

      st.mediaRecorder = chosenMime ? new MediaRecorder(stream,{mimeType:chosenMime}) : new MediaRecorder(stream);
      st.mediaRecorder.ondataavailable = e => { if(e.data.size>0) st.chunks.push(e.data); };
      st.mediaRecorder.onstop = () => {
        const blob = new Blob(st.chunks, {type: st.mimeType});
        st.audioBlob = blob;
        const audioEl = document.getElementById('audio-'+idx);
        audioEl.src = URL.createObjectURL(blob);
        audioEl.style.display = 'block';
        stream.getTracks().forEach(t=>t.stop());
      };
      st.mediaRecorder.start();

      const RecClass = getRecognitionClass();
      if(RecClass){
        st.recognition = new RecClass();
        st.recognition.lang = 'zh-TW';
        st.recognition.continuous = true;
        st.recognition.interimResults = true;
        st.baseText = document.getElementById('text-'+idx).value;
        if(st.baseText) st.baseText += " ";
        st.recognition.onresult = (e) => {
          let finalT = "";
          let interimT = "";
          for(let i=0;i<e.results.length;i++){
            if(e.results[i].isFinal) finalT += e.results[i][0].transcript;
            else interimT += e.results[i][0].transcript;
          }
          document.getElementById('text-'+idx).value = st.baseText + finalT + interimT;
        };
        st.recognition.onerror = () => {};
        st.recognition.start();
      }

      st.recording = true;
      st.startTime = Date.now();
      st.timerInt = setInterval(()=>{
        const sec = Math.floor((Date.now()-st.startTime)/1000);
        const m = String(Math.floor(sec/60)).padStart(2,'0');
        const s = String(sec%60).padStart(2,'0');
        document.getElementById('rectime-'+idx).textContent = m+':'+s;
      },500);

      document.getElementById('recbtn-'+idx).classList.add('active');
      document.getElementById('recbtn-label-'+idx).textContent = "停止錄音";
    }catch(err){
      alert("無法使用麥克風，請確認已允許瀏覽器存取麥克風權限。");
    }
  } else {
    document.getElementById('recbtn-'+idx).classList.remove('active');
    document.getElementById('recbtn-label-'+idx).textContent = "處理錄音中...";
    document.getElementById('recbtn-'+idx).disabled = true;
    document.getElementById('sendbtn-'+idx).disabled = true;

    if(st.recognition) st.recognition.stop();
    clearInterval(st.timerInt);
    st.recording = false;

    await new Promise(resolve => {
      if(st.mediaRecorder && st.mediaRecorder.state !== 'inactive'){
        st.mediaRecorder.addEventListener('stop', resolve, {once:true});
        st.mediaRecorder.stop();
      } else {
        resolve();
      }
    });

    document.getElementById('recbtn-'+idx).disabled = false;
    document.getElementById('sendbtn-'+idx).disabled = false;
    document.getElementById('recbtn-label-'+idx).textContent = "重新錄音";
  }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function getAmpmTimeValue(idx){
  const checked = document.querySelector(`input[name="ampm-${idx}"]:checked`);
  const ampm = checked ? checked.value : '';
  const timeText = (document.getElementById('field-'+idx).value || '').trim();
  if(!ampm && !timeText) return '';
  return (ampm ? ampm + ' ' : '') + timeText;
}

function getSingleChoiceValue(idx){
  const checked = document.querySelector(`input[name="single-${idx}"]:checked`);
  return checked ? checked.value : '';
}

function getMultiselectValue(idx){
  const boxes = document.querySelectorAll(`input[data-multiselect="${idx}"]:checked`);
  return Array.from(boxes).map(b => b.value).join('、');
}

function getScaleValue(idx){
  const boxes = document.querySelectorAll(`input[data-scale="${idx}"]:checked`);
  const values = Array.from(boxes).map(b => b.value);
  const otherIdx = values.indexOf('其他');
  if(otherIdx > -1){
    const otherText = document.getElementById('other-'+idx).value.trim();
    values[otherIdx] = '其他：' + (otherText || '（未填寫說明）');
  }
  return values.join('、');
}

async function postToSheet(item, text, audioBlob, mimeType, fileExt){
  const formData = new FormData();
  formData.append('respondentCode', respondentCode);
  formData.append('section', item.section);
  formData.append('questionId', item.id);
  formData.append('questionText', item.text);
  formData.append('transcriptText', text);

  if(audioBlob){
    const base64 = await blobToBase64(audioBlob);
    formData.append('audioBase64', base64);
    formData.append('audioMime', mimeType || 'audio/webm');
    formData.append('audioExt', fileExt || 'webm');
  }

  await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    body: formData
  });
}

async function sendAnswer(idx){
  const item = ITEMS[idx];
  const st = recState[idx] || {};

  if(item.type === 'record' && st.recording){
    alert("請先按「停止錄音」，再送出這一題。");
    return;
  }

  let text = document.getElementById('text-'+idx).value.trim();
  let audioBlob = st.audioBlob || null;
  const hasText = text.length > 0;
  const hasAudio = !!audioBlob;

  if(hasText && hasAudio){
    const choice = await showChoiceModal(
      "偵測到這一題同時有文字內容與錄音檔，僅能擇一上傳，請選擇：",
      [
        {label:"只上傳文字（不上傳錄音檔）", value:"text"},
        {label:"只上傳錄音檔（清空文字內容）", value:"audio"}
      ]
    );
    if(choice === "text"){
      audioBlob = null;
    } else {
      text = "";
    }
  }

  const btn = document.getElementById('sendbtn-'+idx);
  btn.disabled = true;
  btn.textContent = "送出中...";

  try{
    await postToSheet(item, text, audioBlob, st.mimeType, st.fileExt);
    const card = document.getElementById('qcard-'+idx);
    if(!card.classList.contains('done')){
      card.classList.add('done');
      completedCount++;
      updateProgress();
    }
    document.getElementById('chip-'+idx).classList.add('show');
    btn.textContent = audioBlob ? "已送出（含錄音檔），可再次修改送出" : "已送出（僅文字），可再次修改送出";
    markItemDone(idx, text || (audioBlob ? "（錄音檔，無文字草稿）" : ""));
  }catch(err){
    alert("送出失敗，請檢查網路連線後再試一次。");
    btn.textContent = "送出這一題";
  }
  btn.disabled = false;
}

async function sendBatch(startIdx, endIdx, btnId){
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.textContent = "送出中...";

  let sentCount = 0;
  let skippedCount = 0;

  for(let idx = startIdx; idx <= endIdx; idx++){
    const item = ITEMS[idx];
    let text = "";
    if(item.type === 'text' || item.type === 'date'){
      text = document.getElementById('field-'+idx).value.trim();
    } else if(item.type === 'ampmtime'){
      text = getAmpmTimeValue(idx);
    } else if(item.type === 'singlechoice'){
      text = getSingleChoiceValue(idx);
    } else if(item.type === 'multiselect'){
      text = getMultiselectValue(idx);
    } else if(item.type === 'scale'){
      text = getScaleValue(idx);
    }

    if(!text){
      skippedCount++;
      continue;
    }

    try{
      await postToSheet(item, text, null, null, null);
      const card = document.getElementById('qcard-'+idx);
      if(!card.classList.contains('done')){
        card.classList.add('done');
        completedCount++;
      }
      document.getElementById('chip-'+idx).classList.add('show');
      markItemDone(idx, text);
      sentCount++;
    }catch(err){
      skippedCount++;
    }
  }

  updateProgress();
  btn.disabled = false;
  btn.textContent = (btnId === 'batchbtn-basic') ? "送出觀課基本資訊" : "送出量表勾選結果";

  if(skippedCount > 0){
    alert(`已送出 ${sentCount} 項，尚有 ${skippedCount} 項未填寫，請填寫後再按一次按鈕送出。`);
  } else {
    alert(`已成功送出 ${sentCount} 項。`);
  }
}

function updateProgress(){
  const pct = Math.round((completedCount/ITEMS.length)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `已完成 ${completedCount} / ${ITEMS.length} 題`;
  if(completedCount >= ITEMS.length && !finalized){
    buildReviewPanel();
    document.getElementById('reviewPanel').style.display = 'block';
    document.getElementById('backToReviewBtn').style.display = 'block';
  }
}

function scrollToReview(){
  const panel = document.getElementById('reviewPanel');
  if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'});
}

// ---------- 送出前的內容確認畫面 ----------
function buildReviewPanel(){
  const panel = document.getElementById('reviewPanel');
  let html = `<div class="section-title">內容確認</div>`;
  html += `<p style="font-size:.85rem;color:var(--ink-soft);margin:0 0 14px;">請重新檢視以下已送出的內容，若需修改可點選「回上面修改」跳到該題；修改後記得再按一次該題的送出按鈕，接著可點畫面右下角「回到確認畫面」回來這裡。確認全部無誤後，請按下方按鈕完成本次觀課紀錄表。</p>`;

  let lastSection = null;
  ITEMS.forEach((item, idx) => {
    if(item.section !== lastSection){
      html += `<div style="font-weight:700;color:var(--accent);margin:14px 0 6px;">${escapeHtml(item.section)}</div>`;
      lastSection = item.section;
    }
    const value = (idx <= BASIC_END) ? getSingleChoiceValue(idx) : ((savedProgress[idx] && savedProgress[idx].value) || '');
    html += `<div style="padding:8px 0;border-bottom:1px solid var(--line);">
      <div style="font-size:.92rem;font-weight:600;">${escapeHtml(item.text)}</div>
      <div style="font-size:.9rem;color:var(--ink-soft);margin:4px 0;">${escapeHtml(value) || '（未填寫）'}</div>
      ${idx > BASIC_END ? `<button style="background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0;" onclick="jumpToItem(${idx})">回上面修改</button>` : ''}
    </div>`;
  });

  html += `<div class="batch-submit-wrap"><button class="send-btn" onclick="finalizeSubmission()">確認送出，完成本次觀課紀錄表</button></div>`;
  panel.innerHTML = html;
}

function jumpToItem(idx){
  const card = document.getElementById('qcard-'+idx);
  if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
}

// ---------- 完成本次觀課紀錄表 ----------
function finalizeSubmission(){
  finalized = true;

  const all = loadAllProgress();
  if(!all[respondentCode]) all[respondentCode] = {};
  all[respondentCode].__complete = true;
  if(all.__lastActive) delete all.__lastActive[baseName];
  saveAllProgress(all);

  document.getElementById('reviewPanel').style.display = 'none';
  document.getElementById('questionArea').style.display = 'none';
  document.querySelector('.progress-bar').style.display = 'none';
  document.getElementById('backToReviewBtn').style.display = 'none';

  const banner = document.getElementById('doneBanner');
  banner.style.display = 'block';
  banner.innerHTML = `
    <div style="font-size:1.05rem;margin-bottom:14px;">🎉 本次觀課紀錄表已完成送出，感謝您撥冗填答！</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="send-btn" onclick="resetForNewRound()">繼續填寫下一位教師的觀課紀錄表</button>
      <button class="send-btn" style="background:#fff;color:var(--accent);" onclick="endFillingSession()">結束填寫</button>
    </div>
  `;
}

function endFillingSession(){
  const banner = document.getElementById('doneBanner');
  banner.innerHTML = `<div style="font-size:1.05rem;">已結束本次填答，感謝您的協助，可以關閉此頁面了。</div>`;
}

// ---------- 回到第一頁，重新核對姓名並填寫下一位教師的觀課紀錄 ----------
function resetForNewRound(){
  finalized = false;
  completedCount = 0;
  sessionStarted = false;

  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('reviewPanel').style.display = 'none';
  document.getElementById('backToReviewBtn').style.display = 'none';

  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
}

window.addEventListener('beforeunload', function(e){
  if(sessionStarted && completedCount < ITEMS.length){
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
